<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Welcome Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="portal">
    <section class="welcome-card">
      <p class="eyebrow">Learning platform</p>
      <h1>Student Welcome Portal</h1>
    

    <p class="description">
      Register as a new student and receive a personalized welcome message for your learning journey.
    </p>

    <button id="startButton" type="button">Start Registration</button>

    <div id="message-area" class="message-area">
      <p>Your welcome message will appear here after registration</p>
    </div>
  </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
